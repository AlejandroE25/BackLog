<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog</title>
</head>
<body>
<h1>Backlog</h1>
<form id="login" hidden>
  <input name="passcode" type="password" placeholder="Passcode" autocomplete="current-password" required>
  <select name="name"><option value="me">I'm me</option><option value="friend">I'm friend</option></select>
  <button>Enter</button>
  <p id="loginErr" role="alert"></p>
</form>
<main id="app" hidden>
<p><span id="who"></span> <button id="logout" type="button">Log out</button></p>
<form id="add">
  <input name="title" placeholder="Title" required>
  <select name="kind"><option value="movie">Movie</option><option value="show">Show</option></select>
  <button>Add</button>
  <p id="err" role="alert"></p>
</form>
<ul id="list"></ul>
</main>
<script>
const list = document.getElementById('list'), err = document.getElementById('err');
const $ = (id) => document.getElementById(id);
async function init() {
  const res = await fetch('/api/me');
  $('login').hidden = res.ok;
  $('app').hidden = !res.ok;
  if (res.ok) { $('who').textContent = `Signed in as ${(await res.json()).name}`; load(); }
}
$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ passcode: f.passcode.value, name: f.name.value }),
  });
  $('loginErr').textContent = res.ok ? '' : (await res.json()).error;
  if (res.ok) { f.reset(); init(); }
});
$('logout').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }); init(); });
async function load() {
  const titles = await (await fetch('/api/titles')).json();
  list.replaceChildren(...titles.map((t) => {
    const li = document.createElement('li');
    li.textContent = `${t.title} (${t.kind}) added by ${t.added_by}`;
    return li;
  }));
}
document.getElementById('add').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const res = await fetch('/api/titles', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: f.title.value, kind: f.kind.value }),
  });
  err.textContent = res.ok ? '' : (await res.json()).error;
  if (res.ok) { f.reset(); load(); }
});
init();
</script>
</body>
</html>
