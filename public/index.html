<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #fff; --text: #1d1c1a; --muted: #6b6860; --line: #e2dfd8;
  --accent: #c2410c; --accent-text: #fff; --chip: #efece5; --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 14px rgb(0 0 0 / .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131211; --surface: #1d1c1a; --text: #f1efe9; --muted: #a09c92; --line: #34322e;
    --accent: #f97316; --accent-text: #1a1209; --chip: #2a2825; --shadow: 0 1px 2px rgb(0 0 0 / .5);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
[hidden] { display: none !important; }
.wrap { max-width: 72rem; margin: 0 auto; padding: 0 16px 48px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; }
h1 span { color: var(--accent); }
.who { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .9rem; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }

.card-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
#login { max-width: 24rem; margin: 12vh auto 0; padding: 24px; display: grid; gap: 12px; }
#login h2 { margin: 0 0 4px; }
input[type=text], input[type=password], input:not([type]), select { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

#add { padding: 16px; display: grid; gap: 10px; margin-bottom: 28px; }
#add label { font-weight: 600; }
.combo { position: relative; }
#results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); max-height: 22rem; overflow: auto; }
#results li { display: flex; gap: 12px; align-items: center; padding: 6px; border-radius: 10px; cursor: pointer; }
#results li[aria-selected="true"], #results li:hover { background: var(--chip); }
#results .thumb { width: 40px; height: 60px; border-radius: 6px; object-fit: cover; flex: none; }
.sub { color: var(--muted); font-size: .85rem; }
#msg { margin: 0; min-height: 1.4em; color: var(--muted); font-size: .9rem; }

h2.section { font-size: 1.1rem; margin: 0 0 14px; }
.grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.poster { aspect-ratio: 2 / 3; width: 100%; display: block; object-fit: cover; background: var(--chip); }
.noposter { display: grid; place-items: center; font-size: 3rem; font-weight: 700; color: var(--muted); background: linear-gradient(160deg, var(--chip), var(--line)); }
.body { padding: 10px 12px 12px; display: grid; gap: 4px; }
.title { font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: .75rem; color: var(--muted); }
.note { font-size: .85rem; font-style: italic; overflow-wrap: anywhere; }

.skeleton { aspect-ratio: 2 / 3.6; border-radius: 14px; background: linear-gradient(90deg, var(--chip) 25%, var(--line) 50%, var(--chip) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

#empty { text-align: center; padding: 48px 16px; color: var(--muted); }
#empty strong { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: 4px; }
#err { color: #b91c1c; margin: 0; min-height: 1.4em; }
@media (prefers-color-scheme: dark) { #err { color: #fca5a5; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Back<span>log</span></h1>
    <div class="who" id="who" hidden>
      <span id="whoName"></span>
      <button class="btn" id="logout" type="button">Log out</button>
    </div>
  </header>

  <form id="login" class="card-box" hidden>
    <h2>Welcome</h2>
    <input name="passcode" type="password" placeholder="Passcode" aria-label="Passcode" autocomplete="current-password" required>
    <select name="name" aria-label="Who are you"><option value="me">I'm me</option><option value="friend">I'm friend</option></select>
    <button class="btn primary">Enter</button>
    <p id="err" role="alert"></p>
  </form>

  <main id="app" hidden>
    <div id="add" class="card-box">
      <label for="q">Add a movie or show</label>
      <div class="combo">
        <input id="q" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" autocomplete="off" placeholder="Search IMDb…">
        <ul id="results" role="listbox" hidden></ul>
      </div>
      <input id="note" placeholder="Why should it be watched? (optional)" aria-label="Note" maxlength="300">
      <p id="msg" role="status"></p>
    </div>

    <h2 class="section">Up next</h2>
    <ul id="list" class="grid"></ul>
    <div id="empty" hidden><strong>Nothing in the queue yet</strong>Search above to add the first movie or show.</div>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
// textContent only, never innerHTML: titles, notes and reviews are user text
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k.includes('-') ? n.setAttribute(k, v) : (n[k] = v);
  n.append(...kids);
  return n;
};
const json = (body) => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const say = (m) => { $('msg').textContent = m; };

async function init() {
  const res = await fetch('/api/me');
  $('login').hidden = res.ok;
  $('app').hidden = !res.ok;
  $('who').hidden = !res.ok;
  if (res.ok) { $('whoName').textContent = `Signed in as ${(await res.json()).name}`; load(); }
}
$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const res = await fetch('/api/login', json({ passcode: f.passcode.value, name: f.name.value }));
  $('err').textContent = res.ok ? '' : (await res.json()).error;
  if (res.ok) { f.reset(); init(); }
});
$('logout').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }); init(); });

// ---- queue grid ----
function poster(t) {
  const fallback = () => el('div', { className: 'poster noposter', textContent: t.title.trim().charAt(0).toUpperCase(), 'aria-hidden': 'true' });
  if (!t.poster_url) return fallback();
  const img = el('img', { className: 'poster', src: t.poster_url, alt: `Poster for ${t.title}`, loading: 'lazy', referrerPolicy: 'no-referrer' });
  img.addEventListener('error', () => img.replaceWith(fallback()));
  return img;
}
function card(t) {
  const meta = [t.year, t.kind === 'show' ? 'Show' : 'Movie'].filter(Boolean).join(' · ');
  const body = el('div', { className: 'body' },
    el('div', { className: 'title', textContent: t.title }),
    el('div', { className: 'sub', textContent: meta }),
  );
  if (t.imdb_rating) body.append(el('div', { className: 'sub', textContent: `★ ${t.imdb_rating} IMDb` }));
  body.append(el('div', {}, el('span', { className: 'chip', textContent: `added by ${t.added_by || 'unknown'}` })));
  if (t.note) body.append(el('div', { className: 'note', textContent: `“${t.note}”` }));
  return el('li', { className: 'card' }, poster(t), body);
}
async function load() {
  const list = $('list');
  list.replaceChildren(...Array.from({ length: 6 }, () => el('li', { className: 'skeleton', 'aria-hidden': 'true' })));
  $('empty').hidden = true;
  const res = await fetch('/api/titles');
  if (res.status === 401) return init();
  const titles = await res.json();
  list.replaceChildren(...titles.map(card));
  $('empty').hidden = titles.length > 0;
}

// ---- search combobox ----
const q = $('q'), results = $('results');
let hits = [], active = -1, timer, ctrl;
function close() { results.hidden = true; q.setAttribute('aria-expanded', 'false'); q.removeAttribute('aria-activedescendant'); active = -1; }
function highlight(i) {
  active = i;
  [...results.children].forEach((li, n) => li.setAttribute('aria-selected', n === i));
  if (i >= 0) q.setAttribute('aria-activedescendant', `opt${i}`); else q.removeAttribute('aria-activedescendant');
}
function render() {
  results.replaceChildren(...hits.map((h, i) => {
    const art = h.poster_url
      ? el('img', { className: 'thumb', src: h.poster_url, alt: '', loading: 'lazy', referrerPolicy: 'no-referrer' })
      : el('span', { className: 'thumb noposter', textContent: h.title.charAt(0), 'aria-hidden': 'true' });
    const li = el('li', { id: `opt${i}`, role: 'option' }, art,
      el('span', {}, el('div', { textContent: h.title }), el('div', { className: 'sub', textContent: `${h.year} · ${h.kind === 'show' ? 'Show' : 'Movie'}` })));
    li.addEventListener('mousedown', (e) => { e.preventDefault(); pick(i); });
    return li;
  }));
  results.hidden = !hits.length;
  q.setAttribute('aria-expanded', String(hits.length > 0));
  highlight(-1);
}
async function search() {
  const term = q.value.trim();
  if (term.length < 2) { hits = []; render(); return; }
  ctrl?.abort(); ctrl = new AbortController();
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(term)}`, { signal: ctrl.signal });
    if (res.status === 401) return init();
    if (!res.ok) return say((await res.json()).error);
    hits = await res.json();
    say(hits.length ? '' : 'No matches');
    render();
  } catch (e) { if (e.name !== 'AbortError') say('Search failed'); }
}
async function pick(i) {
  const h = hits[i];
  close();
  say(`Adding ${h.title}…`);
  const res = await fetch('/api/titles', json({ imdb_id: h.imdb_id, note: $('note').value }));
  if (res.status === 401) return init();
  say(res.ok ? `Added ${h.title}` : (await res.json()).error);
  if (res.ok) { q.value = ''; $('note').value = ''; hits = []; load(); }
}
q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 250); });
q.addEventListener('blur', close);
q.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' && hits.length) { e.preventDefault(); if (results.hidden) render(); highlight((active + 1) % hits.length); }
  else if (e.key === 'ArrowUp' && hits.length) { e.preventDefault(); highlight((active - 1 + hits.length) % hits.length); }
  else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); pick(active); }
  else if (e.key === 'Escape') close();
});
init();
</script>
</body>
</html>
