<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackLog</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2a1650">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Back<span>Log</span></h1>
    <div class="who" id="who" hidden>
      <span id="whoName"></span>
      <button class="btn" id="logout" type="button">Log out</button>
    </div>
  </header>

  <form id="login" class="card-box" hidden>
    <h2>Welcome</h2>
    <input name="passcode" type="password" placeholder="Passcode" aria-label="Passcode" autocomplete="current-password" required>
    <select name="name" aria-label="Who are you"><option value="me">I'm me</option><option value="friend">I'm friend</option></select>
    <button class="btn primary">Enter</button>
    <p id="err" role="alert"></p>
    <a href="/">← Back to the public page</a>
  </form>

  <main id="app" hidden>
    <div id="add" class="card-box">
      <label for="q">Add a movie or show</label>
      <div class="combo">
        <input id="q" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" autocomplete="off" placeholder="Search IMDb…">
        <ul id="results" role="listbox" hidden></ul>
      </div>
      <input id="note" placeholder="Why should it be watched? (optional)" aria-label="Note" maxlength="300">
      <p id="msg" role="status"></p>
    </div>

    <section id="inProgressSection">
      <h2 class = "section">In Progress</h2>
      <ul id="inProgress" class="grid"></ul>
    </section>

    <h2 class="section" id="queueHeading">Up next</h2>
    <ul id="list" class="grid"></ul>
    <div id="empty" hidden><strong>Nothing in the queue yet</strong>Search above to add the first movie or show.</div>

    <section id="watchedSection" hidden>
      <h2 class="section">Watched</h2>
      <ul id="watched" class="grid"></ul>
    </section>
  </main>

  <div id="toasts" role="status" aria-live="polite"></div>

  <dialog id="info">
    <div id="infoBody" class="info"></div>
    <div class="row" id="infoActions"><button class="btn primary" type="button" id="infoClose">Close</button></div>
  </dialog>

  <dialog id="confirm">
    <form method="dialog" id="confirmForm">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText" class="sub"></p>
      <div class="row">
        <button class="btn" type="button" id="confirmCancel">Cancel</button>
        <button class="btn primary">Remove</button>
      </div>
    </form>
  </dialog>

  <dialog id="review">
    <form method="dialog" id="reviewForm">
      <h2 id="reviewTitle"></h2>
      <fieldset class="rate">
        <legend>Rating (optional)</legend>
        <label><input type="radio" name="rating" value="1">★</label>
        <label><input type="radio" name="rating" value="2">★</label>
        <label><input type="radio" name="rating" value="3">★</label>
        <label><input type="radio" name="rating" value="4">★</label>
        <label><input type="radio" name="rating" value="5">★</label>
      </fieldset>
      <textarea name="review" aria-label="Review" placeholder="What did you think?" maxlength="5000"></textarea>
      <p id="reviewErr" role="alert"></p>
      <div class="row">
        <button class="btn" type="button" id="reviewCancel">Cancel</button>
        <button class="btn primary">Save</button>
      </div>
    </form>
  </dialog>
</div>
<script>
const $ = (id) => document.getElementById(id);
// textContent only, never innerHTML: titles, notes and reviews are user text
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k.includes('-') ? n.setAttribute(k, v) : (n[k] = v);
  n.append(...kids);
  return n;
};
const json = (body) => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
let me = null;
function toast(msg, bad = false) {
  const t = el('div', { className: bad ? 'toast bad' : 'toast', textContent: msg });
  $('toasts').append(t);
  setTimeout(() => t.remove(), 4000);
}
const say = (m) => { $('msg').textContent = m; };

async function init() {
  const res = await fetch('/api/me');
  $('login').hidden = res.ok;
  $('app').hidden = !res.ok;
  $('who').hidden = !res.ok;
  if (res.ok) { me = (await res.json()).name; $('whoName').textContent = `Signed in as ${me}`; load(); }
}
$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const res = await fetch('/api/login', json({ passcode: f.passcode.value, name: f.name.value }));
  $('err').textContent = res.ok ? '' : (await res.json()).error;
  if (res.ok) location.assign('/');
});
$('logout').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }); location.assign('/'); });

// ---- queue grid ----
function poster(t) {
  const fallback = () => el('div', { className: 'poster noposter', textContent: t.title.trim().charAt(0).toUpperCase(), 'aria-hidden': 'true' });
  if (!t.poster_url) return fallback();
  const img = el('img', { className: 'poster', src: t.poster_url, alt: `Poster for ${t.title}`, loading: 'lazy', referrerPolicy: 'no-referrer' });
  img.addEventListener('error', () => img.replaceWith(fallback()));
  return img;
}
function card(t) {
  const meta = [t.year, t.kind === 'show' ? 'Show' : 'Movie'].filter(Boolean).join(' · ');
  const body = el('div', { className: 'body' },
    el('button', { className: 'title linklike', type: 'button', textContent: t.title, onclick: () => openInfo(t) }),
    el('div', { className: 'sub', textContent: meta }),
  );
  if (t.imdb_rating) body.append(el('div', { className: 'sub', textContent: `★ ${t.imdb_rating} IMDb` }));
  body.append(el('div', {}, el('span', { className: 'chip', textContent: `added by ${t.added_by || 'unknown'}` })));
  if (t.watched_at) {
    if (t.rating) body.append(el('div', { className: 'stars', role: 'img', 'aria-label': `${t.rating} out of 5` , textContent: '★'.repeat(t.rating) + '☆'.repeat(5 - t.rating) }));
    if (t.review) body.append(el('div', { className: 'review', textContent: t.review }));
  } else if (t.note) {
    body.append(el('div', { className: 'note', textContent: `“${t.note}”` }));
  }
  const actions = el('div', { className: 'actions' });
  const canManage = me === 'me' || (t.added_by === me && !t.watched_at);
  if (me === 'me') {
    const b = el('button', { className: 'btn small', type: 'button', textContent: t.watched_at ? 'Edit review' : 'Mark watched' });
    b.addEventListener('click', () => openReview(t));
    actions.append(b);
  }
  if (!t.watched_at && canManage) {
    const b = el('button', { className: 'btn small', type: 'button', textContent: t.in_progress ? 'Move to up next' : 'Mark in progress' });
    b.addEventListener('click', () => setInProgress(t, !t.in_progress));
    actions.append(b);
  }
  // mirrors the server rule: owner removes anything, friend only their own unwatched titles
  if (canManage) {
    const b = el('button', { className: 'btn small danger', type: 'button', textContent: 'Remove', 'aria-label': `Remove ${t.title}` });
    b.addEventListener('click', () => askRemove(t));
    actions.append(b);
  }
  if (actions.children.length) body.append(actions);
  const p = poster(t);
  p.addEventListener('click', () => openInfo(t));
  p.style.cursor = 'pointer';
  return el('li', { className: 'card' }, p, body);
}

// ---- title info: stored basics instantly, full IMDb rundown fetched on open ----
const idlg = $('info');
$('infoClose').addEventListener('click', () => idlg.close());
idlg.addEventListener('click', (e) => { if (e.target === idlg) idlg.close(); });
async function openInfo(t) {
  const body = $('infoBody');
  const facts = el('dl', { className: 'facts' });
  const extra = el('p', { className: 'sub', textContent: t.imdb_id ? 'Loading the IMDb rundown…' : '' });
  const plot = el('p', { textContent: t.plot || '' });
  const meta = [t.year, t.kind === 'show' ? 'Show' : 'Movie'].filter(Boolean).join(' · ');
  body.replaceChildren(
    el('div', { className: 'info-head' }, poster(t), el('div', {},
      el('h2', { textContent: t.title }), el('div', { className: 'sub', textContent: meta }),
      t.imdb_rating ? el('div', { className: 'sub', textContent: `★ ${t.imdb_rating} IMDb` }) : '')),
    plot, facts, extra);
  const links = $('infoActions');
  links.querySelectorAll('a').forEach((a) => a.remove());
  if (t.imdb_id) links.prepend(el('a', { className: 'btn small', href: `https://www.imdb.com/title/${encodeURIComponent(t.imdb_id)}/`, target: '_blank', rel: 'noopener noreferrer', textContent: 'Open on IMDb' }));
  links.prepend(el('a', { className: 'btn small', href: `https://www.justwatch.com/us/search?q=${encodeURIComponent(t.title)}`, target: '_blank', rel: 'noopener noreferrer', textContent: 'Where to watch' }));
  idlg.showModal();
  if (!t.imdb_id) return;
  try {
    const res = await fetch(`/api/titles/${t.id}/details`);
    if (res.status === 401) { idlg.close(); return init(); }
    if (!res.ok) throw new Error();
    const d = await res.json();
    if (d.plot) plot.textContent = d.plot;
    const rows = [['Rated', d.rated], ['Runtime', d.runtime], ['Genre', d.genre], ['Director', d.director], ['Cast', d.actors], ['Awards', d.awards],
      ['Ratings', [d.imdb_votes && t.imdb_rating ? `IMDb ${t.imdb_rating} (${d.imdb_votes} votes)` : '', ...d.ratings.filter((r) => r.source !== 'Internet Movie Database').map((r) => `${r.source} ${r.value}`)].filter(Boolean).join(' · ')]];
    for (const [k, v] of rows) if (v) facts.append(el('dt', { textContent: k }), el('dd', { textContent: v }));
    extra.remove();
    if (d.watch) {
      const line = (label, names) => names.length && el('div', {}, el('strong', { textContent: `${label}: ` }), names.join(', '));
      plot.after(el('div', { className: 'watch' }, el('h3', { textContent: 'Where to watch (US)' }),
        line('Stream', d.watch.stream) || '', line('Rent', d.watch.rent) || '', line('Buy', d.watch.buy) || '',
        el('div', { className: 'sub' }, 'Data from TMDB, provided by ',
          (d.watch.link ? el('a', { href: d.watch.link, target: '_blank', rel: 'noopener noreferrer', textContent: 'JustWatch' }) : 'JustWatch'))));
    }
  } catch { extra.textContent = 'Could not load more details right now.'; }
}

// ---- remove (confirm first) ----
const cdlg = $('confirm');
let removing = null;
function askRemove(t) {
  removing = t;
  $('confirmTitle').textContent = `Remove “${t.title}”?`;
  $('confirmText').textContent = t.watched_at ? 'Its rating and review will be deleted too.' : 'It will disappear from the queue.';
  cdlg.showModal();
}
$('confirmCancel').addEventListener('click', () => cdlg.close());
$('confirmForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch(`/api/titles/${removing.id}`, { method: 'DELETE' });
  cdlg.close();
  if (res.status === 401) return init();
  if (!res.ok) return toast((await res.json()).error, true);
  toast(`Removed ${removing.title}`);
  load();
});

// ---- review dialog (owner only; the server enforces this too) ----
const dlg = $('review'), rf = $('reviewForm');
let editing = null;
function paintStars() {
  const v = Number(rf.rating.value) || 0;
  rf.querySelectorAll('.rate label').forEach((l, i) => l.classList.toggle('on', i < v));
}
rf.addEventListener('change', paintStars);
function openReview(t) {
  editing = t;
  $('reviewTitle').textContent = t.title;
  rf.reset();
  if (t.rating) rf.rating.value = String(t.rating);
  rf.review.value = t.review || '';
  $('reviewErr').textContent = '';
  paintStars();
  dlg.showModal();
}
$('reviewCancel').addEventListener('click', () => dlg.close());
rf.addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch(`/api/titles/${editing.id}`, { ...json({ watched: true, review: rf.review.value, ...(rf.rating.value && { rating: Number(rf.rating.value) }) }), method: 'PATCH' });
  if (res.status === 401) { dlg.close(); return init(); }
  if (!res.ok) { $('reviewErr').textContent = (await res.json()).error; return; }
  dlg.close();
  toast('Review saved');
  load();
});
async function setInProgress(t, inProgress) {
  const res = await fetch(`/api/titles/${t.id}`, { ...json({ in_progress: !!inProgress }), method: 'PATCH' });
  if (res.status === 401) return init();
  if (!res.ok) return toast((await res.json()).error, true);
  toast(inProgress ? `Marked ${t.title} in progress` : `Moved ${t.title} to up next`);
  load();
}
async function load() {
  const list = $('list');
  const inProgress = $('inProgress');
  list.replaceChildren(...Array.from({ length: 6 }, () => el('li', { className: 'skeleton', 'aria-hidden': 'true' })));
  inProgress.replaceChildren(...Array.from({ length: 3 }, () => el('li', { className: 'skeleton', 'aria-hidden': 'true' })));
  $('empty').hidden = true;
  const res = await fetch('/api/titles');
  if (res.status === 401) return init();
  const titles = await res.json();
  const active = titles.filter((t) => !t.watched_at && t.in_progress);
  const queue = titles.filter((t) => !t.watched_at && !t.in_progress);
  const done = titles.filter((t) => t.watched_at).sort((a, b) => b.watched_at.localeCompare(a.watched_at) || b.id - a.id);
  inProgress.replaceChildren(...active.map(card));
  list.replaceChildren(...queue.map(card));
  $('empty').hidden = queue.length + active.length + done.length > 0;
  $('inProgressSection').hidden = active.length === 0;
  $('watched').replaceChildren(...done.map(card));
  $('watchedSection').hidden = done.length === 0;
}

// ---- search combobox ----
const q = $('q'), results = $('results');
let hits = [], active = -1, timer, ctrl;
function close() { results.hidden = true; q.setAttribute('aria-expanded', 'false'); q.removeAttribute('aria-activedescendant'); active = -1; }
function highlight(i) {
  active = i;
  [...results.children].forEach((li, n) => li.setAttribute('aria-selected', n === i));
  if (i >= 0) q.setAttribute('aria-activedescendant', `opt${i}`); else q.removeAttribute('aria-activedescendant');
}
function render() {
  results.replaceChildren(...hits.map((h, i) => {
    const art = h.poster_url
      ? el('img', { className: 'thumb', src: h.poster_url, alt: '', loading: 'lazy', referrerPolicy: 'no-referrer' })
      : el('span', { className: 'thumb noposter', textContent: h.title.charAt(0), 'aria-hidden': 'true' });
    const li = el('li', { id: `opt${i}`, role: 'option' }, art,
      el('span', {}, el('div', { textContent: h.title }), el('div', { className: 'sub', textContent: `${h.year} · ${h.kind === 'show' ? 'Show' : 'Movie'}` })));
    li.addEventListener('mousedown', (e) => { e.preventDefault(); pick(i); });
    return li;
  }));
  results.hidden = !hits.length;
  q.setAttribute('aria-expanded', String(hits.length > 0));
  highlight(-1);
}
async function search() {
  const term = q.value.trim();
  if (term.length < 2) { hits = []; render(); return; }
  ctrl?.abort(); ctrl = new AbortController();
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(term)}`, { signal: ctrl.signal });
    if (res.status === 401) return init();
    if (!res.ok) return say((await res.json()).error);
    hits = await res.json();
    say(hits.length ? '' : 'No matches');
    render();
  } catch (e) { if (e.name !== 'AbortError') say('Search failed'); }
}
async function pick(i) {
  const h = hits[i];
  close();
  say(`Adding ${h.title}…`);
  const res = await fetch('/api/titles', json({ imdb_id: h.imdb_id, note: $('note').value }));
  if (res.status === 401) return init();
  say('');
  if (res.ok) toast(`Added ${h.title}`); else toast((await res.json()).error, true);
  if (res.ok) { q.value = ''; $('note').value = ''; hits = []; load(); }
}
q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 250); });
q.addEventListener('blur', close);
q.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' && hits.length) { e.preventDefault(); if (results.hidden) render(); highlight((active + 1) % hits.length); }
  else if (e.key === 'ArrowUp' && hits.length) { e.preventDefault(); highlight((active - 1 + hits.length) % hits.length); }
  else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); pick(active); }
  else if (e.key === 'Escape') close();
});
init();
</script>
</body>
</html>
